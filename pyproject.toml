[project]
name = "career-quest"
version = "0.1.0"
requires-python = ">=3.12,<4"
dependencies = [
  "fastapi>=0.141.1,<1", "uvicorn>=0.35,<1", "sqlmodel>=0.0.39,<0.1",
  "psycopg[binary]>=3.3.4,<4", "alembic>=1.19.1,<2", "pydantic-settings>=2.10,<3",
  "pyjwt>=2.13,<3", "pwdlib[argon2]>=0.3.1,<1", "python-multipart>=0.0.27,<1",
  "pydantic-ai-slim[openai]>=1.0,<3",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
